<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛玻璃登录示例</title>
    <style>
        /* 全局与动画渐变背景 */
        :root{
            --glass-width: 380px;
        }

        html,body{
            height:100%;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(120deg, #7b2ff7, #2af598 30%, #2575fc 60%, #8e2de2 100%);
            background-size: 300% 300%;
            animation: gradientShift 12s ease infinite;
        }

        @keyframes gradientShift{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        /* 中心容器（毛玻璃） */
        .glass-panel {
            width: var(--glass-width);
            padding: 36px 32px;
            border-radius: 20px;
            box-sizing: border-box;
            color: #fff;
            position: relative;
            backdrop-filter: blur(14px) saturate(120%);
            -webkit-backdrop-filter: blur(14px) saturate(120%);
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 12px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
            transform: translateZ(0);
        }

        .glass-panel h2{
            margin:0 0 8px 0;
            font-weight:600;
            font-size:22px;
            letter-spacing:0.4px;
        }

        .sub{margin:0 0 18px 0;color:rgba(255,255,255,0.85);font-size:13px}

        /* 表单样式 */
        .login-form{display:flex;flex-direction:column;gap:12px}

        label{display:flex;flex-direction:column;font-size:12px;color:rgba(255,255,255,0.9)}

        input[type="text"], input[type="password"]{
            margin-top:8px;
            padding:10px 12px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: #fff;
            outline: none;
            font-size:14px;
            transition: box-shadow .18s ease, border-color .18s ease;
            -webkit-appearance: none;
        }

        input::placeholder{color:rgba(255,255,255,0.6)}

        input:focus{
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            background: rgba(255,255,255,0.06);
        }

        .form-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}

        .checkbox{font-size:13px;color:rgba(255,255,255,0.8)}

        .checkbox input{margin-right:8px;vertical-align:middle}

        .glass-btn{
            margin-left:auto;
            padding:10px 20px;
            border-radius:999px;
            border:1px solid rgba(255,255,255,0.22);
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
            color:#fff;
            cursor:pointer;
            font-weight:600;
            letter-spacing:1px;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .glass-btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,0.28)}

        /* 小屏适配 */
        @media (max-width:420px){
            .glass-panel{width:92%;padding:28px;border-radius:16px}
        }

    </style>
</head>
<body>

    <div class="glass-panel" role="region" aria-labelledby="login-title">
        <h2 id="login-title">欢迎登录</h2>
        <p class="sub">使用你的账号密码登录以继续。</p>

        <form class="login-form" action="#" method="post" aria-describedby="login-desc" novalidate>
            <label for="username">用户名
                <input id="username" name="username" type="text" placeholder="请输入用户名" required>
            </label>

            <label for="password">密码
                <input id="password" name="password" type="password" placeholder="请输入密码" required>
            </label>

            <div class="form-row">
                <label class="checkbox"><input type="checkbox" name="remember"> 记住我</label>
                <button type="submit" class="glass-btn">登录</button>
            </div>
        </form>
    </div>

</body>
</html>
